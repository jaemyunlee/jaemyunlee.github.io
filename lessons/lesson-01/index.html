<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lesson 1: Morning Routine & Daily Habits - RhyRhy English</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <meta name="theme-color" content="#4F46E5">
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="../../assets/icons/icon.svg">

  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/navigation.css">
  <link rel="stylesheet" href="../../css/quiz.css">
  <link rel="stylesheet" href="../../css/video-script.css">
  <link rel="stylesheet" href="../../css/drag-drop.css">
  <link rel="stylesheet" href="../../css/modal.css">
  <link rel="stylesheet" href="../../css/review-player.css">
</head>

<body>

  <!-- Navigation Bar -->
  <header class="main-nav" id="main-nav"></header>

  <main class="app-container">
    <!-- Lesson Header (Only Badges) -->
    <section class="lesson-header-section" style="margin-bottom: 14px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="badge badge-primary">Lesson 01</span>
        <span class="badge badge-emerald" id="lesson-status-badge">Step 1: Quiz</span>
      </div>
    </section>

    <!-- Step Navigation Tabs (1, 2, 3, 4) -->
    <nav class="lesson-step-tabs" id="lesson-step-tabs" aria-label="학습 단계 이동">
      <button type="button" class="step-tab-btn active" data-step="1">
        <span class="step-num">1</span>
        <span class="step-label">퀴즈</span>
      </button>
      <button type="button" class="step-tab-btn" data-step="2">
        <span class="step-num">2</span>
        <span class="step-label">영상 & 대본</span>
      </button>
      <button type="button" class="step-tab-btn" data-step="3">
        <span class="step-num">3</span>
        <span class="step-label">영작 & 댓글</span>
      </button>
      <button type="button" class="step-tab-btn" data-step="4">
        <span class="step-num">4</span>
        <span class="step-label">문장 총복습 🎧</span>
      </button>
    </nav>

    <!-- Pre-Video Quizzes Section -->
    <section class="quiz-section-wrapper" id="quiz-section" aria-label="Pre-Video Quizzes">
      <div id="quiz-container">
        <!-- Rendered dynamically by QuizEngine -->
        <div style="text-align: center; padding: 40px;">
          <p>퀴즈 데이터를 불러오는 중입니다...</p>
        </div>
      </div>
    </section>

    <!-- Video & Interactive Script Section (Step 2) -->
    <section class="video-section" id="video-section" aria-label="Video and Interactive Script"
      style="display: none; margin-top: 24px;">

      <div class="video-script-grid" id="video-script-grid">
        <!-- Video Player Column (Top on mobile, Left on desktop) -->
        <div class="video-player-column" id="video-player-col">
          <div class="video-frame-wrapper">
            <div id="youtube-player-container"></div>
          </div>

          <!-- Video Controls Toolbar -->
          <div class="video-toolbar">
            <button type="button" class="btn-ctrl" id="btn-play-pause-toggle" title="재생 / 일시정지">
              <span id="play-pause-icon">▶ 재생</span>
            </button>

            <div class="video-speed-controls">
              <span class="speed-label">Speed:</span>
              <button type="button" class="btn-speed" data-speed="0.75">0.75x</button>
              <button type="button" class="btn-speed active" data-speed="1.0">1.0x</button>
              <button type="button" class="btn-speed" data-speed="1.25">1.25x</button>
            </div>

            <a href="https://www.youtube.com/watch?v=N5IqYrNUqmQ" target="_blank" rel="noopener noreferrer"
              class="btn-yt-direct" id="btn-yt-direct" title="YouTube 새 창에서 직접 보기">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="#FF0000">
                <path
                  d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
              </svg>
            </a>
          </div>
        </div>

        <!-- Interactive Script Panel (Bottom on mobile, Right on desktop) -->
        <div class="script-panel-column" id="script-panel-main">
          <div class="script-panel-header">
            <div class="script-header-title">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
              </svg>
              <strong>Interactive Script</strong>
            </div>

            <div class="script-sub-toggle-group" role="group" aria-label="Subtitle Language">
              <button type="button" class="btn-toggle-sub active" data-subtitle-mode="both">Both</button>
              <button type="button" class="btn-toggle-sub" data-subtitle-mode="en">EN</button>
              <button type="button" class="btn-toggle-sub" data-subtitle-mode="kr">KR</button>
            </div>
          </div>

          <div class="script-list-container" id="script-list-container" role="feed" aria-label="Bilingual Script Lines">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </div>
    </section>

    <!-- Post-Video Reflection & YouTube Comment Nudge (Step 3) -->
    <section class="reflection-wrapper" id="reflection-section" style="display: none;">
      <div id="reflection-container"></div>
    </section>

    <!-- Step 4: Final Review & Audio Player Section -->
    <section class="review-section-wrapper" id="review-section" aria-label="Step 4: Review and Audio Player"
      style="display: none;">
      <div id="review-player-container"></div>
    </section>
  </main>

  <!-- Bottom Drag & Drop Storage Dock -->
  <div class="storage-dock-overlay" id="storage-dock-overlay" aria-hidden="true">
    <div class="storage-drop-zone" id="storage-drop-zone">
      <div class="storage-dock-icon">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
        </svg>
      </div>
      <div class="storage-dock-text">
        <span class="storage-dock-title">Drop here to Save!</span>
        <span class="storage-dock-desc">Add sentence to your bank</span>
      </div>
    </div>
  </div>

  <div class="celebration-overlay" id="celebration-overlay" aria-hidden="true"></div>

  <!-- Notification Toast Container -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Core Scripts -->
  <script src="../../assets/vendor/lottie.min.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/markdown-quiz-parser.js"></script>
  <script src="../../js/quiz-engine.js"></script>
  <script src="../../js/drag-drop.js"></script>
  <script src="../../js/video-script.js"></script>
  <script src="../../js/celebration.js"></script>
  <script src="../../js/youtube-comment.js"></script>
  <script src="../../js/review-player.js"></script>
  <script src="../../js/app.js"></script>

  <script>
    // Initialize Lesson 01
    document.addEventListener('DOMContentLoaded', async () => {
      const LESSON_ID = 'lesson-01';

      // 1. Initialize Global App Shell (Navbar, Sentence Drawer, History Drawer, Offline detection)
      App.init(LESSON_ID);

      // 2. Initialize Managers
      const celebrationManager = new CelebrationManager({
        lottiePath: '../../assets/lottie/celebration.json'
      });

      const dragDropManager = new DragDropManager({
        lessonId: LESSON_ID,
        storageDock: '#storage-dock-overlay',
        dropZone: '#storage-drop-zone',
        onSave: () => App.updateSentenceBadge()
      });
      dragDropManager.init();

      const quizSection = document.getElementById('quiz-section');
      const lessonHeader = document.querySelector('.lesson-header-section');
      const videoSection = document.getElementById('video-section');
      const reflectionSection = document.getElementById('reflection-section');
      const reviewSection = document.getElementById('review-section');
      const statusBadge = document.getElementById('lesson-status-badge');

      // Pre-matched audio files for Lesson 01
      const LESSON_01_AUDIO_FILES = [
        "I just happened to look.wav", // Q1
        "obviously Jaemyun cant go with me because someone has to watch the kids..wav", // Q2
        "We got tickets that are pretty much in the back the nosebleed section..wav", // Q3
        "we have a decent view..wav", // Q4
        "Its not like its on the side or like at a weird or obstructed angle or anything.wav", // Q5
        "Compared to what we paid in Korea for tickets its decent.wav", // Q6
        "At least thats what I understood.wav", // Q7
        "I started to like it a lot and listening to it..wav", // Q8
        "you were in a cast up past your knee to your thigh like all the way down.wav", // Q9
        "there was no way you were getting up to those seats.wav", // Q10
        "it turned out theyre only going to two citiesOakland and New Jersey.wav", // Q11
        "And then go to the concert and spend the night.wav", // Q12
        "Hopefully Amy doesnt mind..wav", // Q13
        "I dont know when they officially went on sale but it seemed like everything was sold..wav", // Q14
        "I dont know what year that came out.wav", // Q15
        "i think it was around there.wav", // Q16
        "The first time I heard it I didnt love it but it did grow on me quite a lot..wav", // Q17
        "because I have a lot of assignments due Sunday.wav", // Q18
        "it was when the new song came out.wav", // Q19
        "So I thought it was pretty unlikely that I would get to go and find someone..wav", // Q20
        "but they finally just put us in to one of the handicap seats which ended up having an amazing view.wav" // Q21
      ];

      let metadata = {};
      let scriptData = [];
      let loadedQuizzes = [];
      let videoPlayer = null;
      let reviewPlayer = null;

      try {
        const metaRes = await fetch('./metadata.json');
        if (metaRes.ok) metadata = await metaRes.json();
      } catch (e) {
        console.warn('Could not load metadata.json', e);
      }

      try {
        const scriptRes = await fetch('./script.json');
        if (scriptRes.ok) scriptData = await scriptRes.json();
      } catch (e) {
        console.warn('Could not load script.json', e);
      }

      const commentManager = new YouTubeCommentManager({
        lessonId: LESSON_ID,
        youtubeId: metadata.youtubeId || 'N5IqYrNUqmQ',
        lessonMetadata: metadata,
        celebrationManager: celebrationManager,
        container: '#reflection-container',
        onComplete: () => {
          showStep(4, true);
        }
      });
      commentManager.init();

      // Unified Step Navigation (1, 2, 3, 4) with LocalStorage Memory
      const showStep = (stepNumber, scroll = true) => {
        const step = Math.min(4, Math.max(1, stepNumber));
        Storage.setCurrentStep(LESSON_ID, step);

        if (step3Modal) step3Modal.style.display = 'none';

        // Pause review audio if leaving step 4
        if (step !== 4 && reviewPlayer) {
          reviewPlayer.pause();
        }

        // Manage Section Displays
        if (quizSection) quizSection.style.display = (step === 1) ? 'block' : 'none';
        if (videoSection) videoSection.style.display = (step === 2) ? 'block' : 'none';
        if (reflectionSection) reflectionSection.style.display = (step === 3) ? 'block' : 'none';
        if (reviewSection) reviewSection.style.display = (step === 4) ? 'block' : 'none';

        // Update Step Tab Buttons
        const tabBtns = document.querySelectorAll('.step-tab-btn');
        tabBtns.forEach(btn => {
          const s = parseInt(btn.dataset.step, 10);
          btn.classList.toggle('active', s === step);
        });

        // Update Status Badge
        if (statusBadge) {
          if (step === 1) {
            statusBadge.textContent = 'Step 1: Quiz';
            statusBadge.className = 'badge badge-emerald';
          } else if (step === 2) {
            statusBadge.textContent = 'Step 2: Video & Script';
            statusBadge.className = 'badge badge-primary';
          } else if (step === 3) {
            statusBadge.textContent = 'Step 3: Writing & Comments';
            statusBadge.className = 'badge badge-amber';
          } else if (step === 4) {
            statusBadge.textContent = 'Step 4: Review & Audio Player';
            statusBadge.className = 'badge badge-emerald';
          }
        }

        // Lazy-init Video Player on Step 2
        if (step === 2 && !videoPlayer) {
          videoPlayer = new VideoScriptPlayer({
            lessonId: LESSON_ID,
            youtubeId: metadata.youtubeId || 'N5IqYrNUqmQ',
            scriptData: scriptData,
            dragDropManager: dragDropManager,
            onVideoEnd: () => showStep3Nudge(),
            onScriptComplete: () => showStep3Nudge()
          });
          videoPlayer.init();
        }

        // Lazy-init Review Player on Step 4
        if (step === 4 && loadedQuizzes.length > 0) {
          if (!reviewPlayer) {
            reviewPlayer = new ReviewPlayer({
              container: '#review-player-container',
              lessonId: LESSON_ID,
              quizzes: loadedQuizzes,
              audioBaseUrl: './audio/',
              audioFiles: LESSON_01_AUDIO_FILES,
              celebrationManager: celebrationManager,
              dragDropManager: dragDropManager
            });
            reviewPlayer.init();
          }
        }

        if (step === 3) {
          setTimeout(() => {
            commentManager.nudgeFocus();
          }, 300);
        }

        if (scroll) {
          try {
            if (step === 2 && videoSection) {
              const navHeight = 70;
              const y = videoSection.getBoundingClientRect().top + window.pageYOffset - navHeight;
              window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
            } else {
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          } catch (_) {
            window.scrollTo(0, 0);
          }
        }
      };

      // Step Navigation Tabs Click Binding
      document.querySelectorAll('.step-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const s = parseInt(btn.dataset.step, 10);
          showStep(s, true);
        });
      });

      // Global click delegation for '영상 & 대본 보러가기' button
      document.addEventListener('click', (e) => {
        if (e.target.closest('#btn-goto-video')) {
          e.preventDefault();
          showStep(2, true);
        }
      });

      // Step 3 Nudge Popup Modal
      const step3Modal = document.getElementById('step3-nudge-modal');
      const btnModalGotoStep3 = document.getElementById('btn-modal-goto-step3');
      const btnModalCloseNudge = document.getElementById('btn-modal-close-nudge');

      const showStep3Nudge = () => {
        if (step3Modal) {
          step3Modal.style.display = 'flex';
        }
      };

      if (btnModalGotoStep3) {
        btnModalGotoStep3.addEventListener('click', () => {
          showStep(3, true);
        });
      }
      if (btnModalCloseNudge) {
        btnModalCloseNudge.addEventListener('click', () => {
          if (step3Modal) step3Modal.style.display = 'none';
        });
      }

      // Script list completion banner click
      document.addEventListener('click', (e) => {
        if (e.target.closest('#btn-banner-goto-step3')) {
          showStep(3, true);
        }
      });

      // Load Quizzes from Markdown
      try {
        const quizzes = await MarkdownQuizParser.loadFromUrl('./quiz.md');
        loadedQuizzes = quizzes;
        commentManager.setQuizzes(quizzes);

        // Resume previously active step from LocalStorage
        const savedStep = Storage.getCurrentStep(LESSON_ID);
        showStep(savedStep, false);

        const quizEngine = new QuizEngine({
          container: '#quiz-container',
          lessonId: LESSON_ID,
          quizzes: quizzes,
          onComplete: (info) => {
            if (!info.alreadyCompleted) {
              celebrationManager.celebrate({
                title: '모든 퀴즈 완료! 🎯',
                message: '핵심 어휘와 표현을 모두 마스터하셨습니다. 이제 영상을 시청해보세요!',
                actionLabel: '영상 & 대본 학습으로 이동 ▶',
                onAction: () => {
                  showStep(2, true);
                }
              });
            }
          },
          onStartVideo: () => {
            showStep(2, true);
          }
        });
        quizEngine.init();
      } catch (err) {
        console.error('Failed to load quiz markdown:', err);
        document.getElementById('quiz-container').innerHTML = `
          <div class="quiz-feedback error">Failed to load quiz.md. Please check the file path.</div>
        `;
      }
    });
  </script>

  <!-- Step 3 Nudge Popup Modal -->
  <div class="nudge-modal-overlay" id="step3-nudge-modal" style="display: none;" role="dialog" aria-modal="true"
    aria-labelledby="nudge-modal-title">
    <div class="nudge-modal-card">
      <div class="nudge-modal-icon">🎉</div>
      <h3 class="nudge-modal-title" id="nudge-modal-title">영상 & 스크립트 학습 완료!</h3>
      <p class="nudge-modal-desc">
        모든 대화 스크립트를 끝까지 학습하셨습니다.<br>
        이제 오늘 배운 핵심 어휘와 표현을 활용해 <strong>나만의 문장을 직접 영작</strong>하고, <strong>유튜브에 댓글</strong>을 남겨보세요!
      </p>
      <div class="nudge-modal-actions">
        <button type="button" class="btn btn-primary btn-modal-step3" id="btn-modal-goto-step3">
          <span>✍️ Step 3: 문장 작성 & 댓글 남기기</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>
        <button type="button" class="btn-modal-dismiss" id="btn-modal-close-nudge">
          <span>대본 더 복습하기</span>
        </button>
      </div>
    </div>
  </div>
</body>

</html>
