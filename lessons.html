<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>전체 레슨 목록 - 현서네 리얼 영어</title>
  <meta name="description" content="현서네 리얼 영어 전체 레슨 목록. 일상 생활 영어 3분 퀴즈, 원어민 유튜브 영상, 한영 스크립트 학습.">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#4F46E5">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="./assets/icons/icon.svg">

  <script>
    (function(){try{var t=localStorage.getItem('rhyrhy_theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/navigation.css">
  <link rel="stylesheet" href="./css/quiz.css">
  <link rel="stylesheet" href="./css/modal.css">

  <style>
    .lessons-page-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 16px 64px;
    }

    .lessons-page-header {
      text-align: center;
      max-width: 680px;
      margin: 0 auto 40px;
    }

    .lessons-page-header .catalog-badge {
      margin-bottom: 14px;
    }

    .lessons-page-header .catalog-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .lessons-page-header .catalog-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.6;
      word-break: keep-all;
    }

    /* Lessons Sorting Toolbar */
    .lessons-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--surface-color);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 12px 20px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
    }

    .lessons-count-info {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .lessons-count-info strong {
      color: var(--primary-light);
      font-weight: 800;
    }

    .lessons-sort-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sort-label-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-subtle);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sort-toggle-group {
      display: inline-flex;
      align-items: center;
      background: var(--bg-color);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-full);
      padding: 3px;
      gap: 3px;
    }

    .btn-sort-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: transparent;
      border: none;
      border-radius: var(--radius-full);
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .btn-sort-pill:hover {
      color: var(--text-main);
      background: var(--surface-color-alt);
    }

    .btn-sort-pill.active {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #FFFFFF;
      box-shadow: 0 2px 10px var(--primary-glow);
    }

    .btn-sort-pill svg {
      flex-shrink: 0;
    }

    @media (max-width: 640px) {
      .lessons-page-container {
        padding: 24px 12px 48px;
      }

      .lessons-page-header {
        margin-bottom: 24px;
      }

      .lessons-page-header .catalog-title {
        font-size: 1.75rem;
      }

      .lessons-page-header .catalog-subtitle {
        font-size: 0.95rem;
      }

      .lessons-toolbar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding: 12px 16px;
      }

      .lessons-sort-wrapper {
        justify-content: space-between;
      }

      .sort-toggle-group {
        flex: 1;
        justify-content: center;
      }

      .btn-sort-pill {
        flex: 1;
        justify-content: center;
        padding: 7px 10px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>

<body>
  <!-- Navigation Bar -->
  <header class="main-nav" id="main-nav"></header>

  <main class="app-container lessons-page-container">
    <!-- Exclusive Lessons List Header -->
    <header class="lessons-page-header">
      <div class="catalog-badge">
        <span>📖</span> 전체 레슨 목록 (Curriculum)
      </div>
      <h1 class="catalog-title">전체 레슨 목록</h1>
      <p class="catalog-subtitle">
        원하는 레슨 카드를 선택하여 3분 퀴즈와 원어민 유튜브 영상 스크립트 학습을 시작해보세요.
      </p>
    </header>

    <!-- Sort Toolbar: Ascending & Descending options -->
    <div class="lessons-toolbar">
      <div class="lessons-count-info">
        총 <strong id="total-lessons-count">3</strong>개의 레슨
      </div>

      <div class="lessons-sort-wrapper">
        <span class="sort-label-text">정렬</span>
        <div class="sort-toggle-group" role="group" aria-label="레슨 정렬 순서">
          <button type="button" class="btn-sort-pill active" data-sort="desc" title="최신 레슨부터 보기 (Descending)">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 5v14M5 12l7 7 7-7" />
            </svg>
            <span>최신순 (Desc)</span>
          </button>
          <button type="button" class="btn-sort-pill" data-sort="asc" title="1강부터 순서대로 보기 (Ascending)">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
            <span>1강부터 (Asc)</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Cards View of All Lessons -->
    <section class="lessons-catalog-section" style="padding: 0;">
      <div class="lessons-cards-grid" id="lessons-cards-container">
        <!-- Rendered dynamically by App.renderLessonsCatalog() -->
      </div>
    </section>
  </main>

  <!-- Core Scripts -->
  <script src="./js/storage.js"></script>
  <script src="./js/analytics.js"></script>
  <script src="./js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Mark as exclusive lessons list page
      App.init('lessons-list');
    });
  </script>
</body>

</html>
